<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>胡方峥的个人主页</title>
  <style>
    /* ===== 基础 ===== */
    * {
      box-sizing: border-box;
    }

    html {
      /* 锚点跳转时目标不被导航栏盖住 */
      scroll-padding-top: 84px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding-top: 64px;
      /* 给固定导航栏留出高度 */
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 17px;
      line-height: 1.7;
      color: #24364b;
      /* 画布就绪前的兜底底色 */
      background: #eaf7ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== 动态波纹背景 ===== */
    #bg-waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      opacity: .86;
      pointer-events: none;
    }

    /* 星光粒子层：与波浪同层，靠 DOM 顺序压在其上，仍在 main（z-index:1）之下 */
    #bg-stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      /* 绝不遮挡页面点击 / 轮播拖拽 */
      pointer-events: none !important;
    }

    /* 细颗粒质感，让蓝色不"塑料"，更有纸张/胶片感 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .035;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
    }

    /* ===== 固定导航栏（磨砂玻璃） ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background: rgba(255, 255, 255, .66);
      -webkit-backdrop-filter: blur(26px) saturate(170%);
      backdrop-filter: blur(26px) saturate(170%);
      border-bottom: 1px solid rgba(255, 255, 255, .85);
      box-shadow: 0 8px 30px rgba(30, 100, 170, .12);
    }

    .nav a {
      position: relative;
      color: #075d9c;
      text-decoration: none;
      padding: 4px 2px;
      border-bottom: 2px solid transparent;
      transition: color .3s, border-color .3s;
    }

    .nav a:hover {
      color: #043f6d;
      border-bottom-color: #075d9c;
    }

    /* ===== 内容卡片（半透明玻璃，波纹从背后透出） ===== */
    main {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 32px auto 56px;
      padding: 40px 40px 36px;
      background: rgba(255, 255, 255, .84);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      backdrop-filter: blur(36px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 20px;
      box-shadow:
        0 24px 64px rgba(40, 110, 180, .16),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      animation: cardIn .9s cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ===== 标题 ===== */
    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.15;
      background: linear-gradient(100deg, #0b5aa0, #1195e0 30%, #4fc3f7 50%, #1195e0 70%, #0b5aa0);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 9s ease-in-out infinite;
    }

    @keyframes sheen {
      0%, 100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      color: #123c60;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    /* 只有直接放在 main 下的 h2 才需要上间距 */
    main>h2 {
      margin-top: 34px;
    }

    p {
      margin: 0 0 12px;
    }

    a {
      color: #0867a6;
      transition: color .3s;
    }

    a:hover {
      color: #043f6d;
    }

    /* ===== 个人简介（上方留出"画卷走廊"，供剑客行过） ===== */
    .profile {
      position: relative;
      margin-top: 26px;
      padding: 174px 30px 30px;
      background:
        radial-gradient(120% 100% at 100% 0%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 60%),
        linear-gradient(135deg, rgba(240, 250, 255, .92), rgba(224, 242, 255, .62));
      border: 1px solid rgba(30, 130, 200, .14);
      border-radius: 16px;
      overflow: visible;
    }

    /* ===== 头像：「神」字幻化成水墨剑客，随圆形向右行 ===== */
    .avatar {
      /* 行走终点（圆形最右端），小屏时通过变量调整 */
      --travel-end: calc(100% - 160px);

      position: absolute;
      top: 18px;
      left: 20px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      animation: travel 18s cubic-bezier(.42, 0, .5, 1) 1 both;
    }

    /* 圆盘本体单独一层：抵达右端后自行溶掉，只剩墨迹 */
    .avatar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #fffefb 0%, #fbf8f1 46%, #eee7d9 100%);
      border: 1px solid rgba(60, 55, 45, .24);
      box-shadow:
        0 14px 30px rgba(40, 60, 90, .15),
        inset 0 0 26px rgba(120, 110, 90, .08);
      animation: circleFade 18s linear 1 both;
    }

    @keyframes circleFade {
      0%, 79% {
        opacity: 1;
      }

      83% {
        opacity: .62;
      }

      87%, 100% {
        opacity: 0;
      }
    }

    /* 圆形沿画卷向右移动，到最右端停留后淡出重来 */
    @keyframes travel {
      0% {
        left: 20px;
        opacity: 0;
      }

      5% {
        left: 20px;
        opacity: 1;
      }

      80% {
        left: var(--travel-end);
        opacity: 1;
      }

      97% {
        left: var(--travel-end);
        opacity: 1;
      }

      100% {
        left: var(--travel-end);
        opacity: 0;
      }
    }

    /* 「神」字：先登场，再化墨而去 */
    .glyph {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      font-family: "STKaiti", "KaiTi", "SimSun", serif;
      font-size: 64px;
      line-height: 1;
      color: rgba(32, 36, 44, .9);
      text-shadow: 0 0 1px rgba(32, 36, 44, .3);
      pointer-events: none;
      animation: glyphMorph 18s linear infinite;
    }

    @keyframes glyphMorph {
      0%, 5% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }

      13% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(1.5);
      }

      100% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(1.5);
      }
    }

    .avatar svg {
      position: relative;
      z-index: 1;
      width: 140px;
      height: 140px;
      display: block;
      overflow: visible;
    }

    /* ===== 水墨剑客的笔触 ===== */
    .avatar .ink {
      fill: none;
      stroke: rgba(32, 36, 44, .92);
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .avatar .torso {
      stroke-width: 4;
    }

    .avatar .arm-guard {
      stroke: rgba(32, 36, 44, .78);
      stroke-width: 3.2;
    }

    .avatar .cape {
      fill: rgba(52, 62, 78, .12);
      stroke: rgba(52, 62, 78, .45);
      stroke-width: 2.2;
      stroke-linejoin: round;
      transform-box: view-box;
      transform-origin: 68px 60px;
      animation: capeSway 1.2s ease-in-out infinite alternate;
    }

    @keyframes capeSway {
      from {
        transform: rotate(-2.5deg);
      }

      to {
        transform: rotate(3.2deg);
      }
    }

    .avatar .hat {
      fill: rgba(32, 36, 44, .9);
      stroke: none;
    }

    .avatar .hat-rim {
      fill: none;
      stroke: rgba(252, 249, 242, .5);
      stroke-width: 1.4;
      stroke-linecap: round;
    }

    /* 空心圆脑袋 + 关节点 + 脚下墨渍 */
    .avatar .head-ring {
      fill: none;
      stroke: rgba(32, 36, 44, .9);
      stroke-width: 3;
    }

    .avatar .joint {
      fill: rgba(32, 36, 44, .85);
      stroke: none;
    }

    .avatar .ground {
      fill: rgba(70, 66, 58, .16);
      stroke: none;
      transform-box: view-box;
      transform-origin: 76px 150px;
      animation: groundBreath 2.4s ease-in-out infinite;
    }

    .avatar .ground-2 {
      fill: rgba(70, 66, 58, .08);
      stroke: none;
    }

    @keyframes groundBreath {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      40% {
        transform: scale(1.07);
        opacity: .8;
      }

      56% {
        transform: scale(.97);
        opacity: 1;
      }
    }

    .avatar .sword-blade {
      fill: none;
      stroke: rgba(32, 36, 44, .95);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .avatar .sword-hilt {
      fill: none;
      stroke: rgba(32, 36, 44, .85);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .avatar .aura-1 {
      fill: none;
      stroke: rgba(32, 36, 44, .5);
      stroke-width: 2.6;
      stroke-linecap: round;
    }

    .avatar .aura-2 {
      fill: none;
      stroke: rgba(32, 36, 44, .28);
      stroke-width: 1.4;
      stroke-linecap: round;
    }

    /* 幻化：墨影聚成小人 */
    .avatar .morph {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 74px 90px;
      animation: figureMorph 18s linear infinite;
    }

    @keyframes figureMorph {
      0%, 7% {
        opacity: 0;
        filter: blur(10px);
        transform: scale(.85);
      }

      16% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }

      97% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }

      100% {
        opacity: 0;
        filter: blur(8px);
        transform: scale(1.05);
      }
    }

    /* 行进中的前倾：与圆形右移同周期，保持平衡感 */
    .avatar .lean {
      transform-box: view-box;
      transform-origin: 72px 98px;
      animation: lean 18s linear infinite;
    }

    @keyframes lean {
      0%, 8% {
        transform: rotate(0deg);
      }

      24% {
        transform: rotate(2.4deg);
      }

      72% {
        transform: rotate(2.4deg);
      }

      86%, 100% {
        transform: rotate(0deg);
      }
    }

    /* 出剑时的重心变化：劈出时微仰，收剑时回正 */
    .avatar .figure {
      transform-box: view-box;
      transform-origin: 72px 98px;
      animation: balance 2.4s ease-in-out infinite;
    }

    @keyframes balance {
      0%, 100% {
        transform: rotate(0deg);
      }

      40% {
        transform: rotate(-2.2deg);
      }

      56% {
        transform: rotate(1.4deg);
      }

      74% {
        transform: rotate(0deg);
      }
    }

    /* 持剑臂：举剑蓄力 → 劈出 → 收剑 */
    .avatar .arm-sword {
      animation: swing 2.4s cubic-bezier(.45, .05, .35, 1) infinite;
    }

    @keyframes swing {
      0%, 6% {
        transform: translate(76px, 64px) rotate(-52deg) translate(-76px, -64px);
      }

      40% {
        transform: translate(76px, 64px) rotate(26deg) translate(-76px, -64px);
      }

      52% {
        transform: translate(76px, 64px) rotate(20deg) translate(-76px, -64px);
      }

      74% {
        transform: translate(76px, 64px) rotate(-24deg) translate(-76px, -64px);
      }

      100% {
        transform: translate(76px, 64px) rotate(-52deg) translate(-76px, -64px);
      }
    }

    /* 剑气：随劈出飞向右前方，渐淡消散 */
    .avatar .aura {
      opacity: 0;
      animation: slash 2.4s linear infinite;
    }

    @keyframes slash {
      0%, 34% {
        opacity: 0;
        transform: translate(0, 0) scale(.9);
      }

      42% {
        opacity: .9;
        transform: translate(4px, -2px) scale(1);
      }

      66% {
        opacity: .35;
        transform: translate(36px, 2px) scale(1.25);
      }

      84% {
        opacity: 0;
        transform: translate(60px, 6px) scale(1.45);
      }

      100% {
        opacity: 0;
        transform: translate(60px, 6px) scale(1.45);
      }
    }

    /* ===== 到达右端后化作一滩墨水滑落 ===== */
    .avatar .melt {
      transform-box: view-box;
      transform-origin: 74px 150px;
      animation: meltAway 18s linear infinite;
    }

    @keyframes meltAway {
      0%, 80% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1, 1) translateY(0);
      }

      85% {
        opacity: .92;
        filter: blur(1.2px);
        transform: scale(1.03, .78) translateY(6px);
      }

      89% {
        opacity: .45;
        filter: blur(4px);
        transform: scale(.94, .32) translateY(21px);
      }

      93%, 100% {
        opacity: 0;
        filter: blur(8px);
        transform: scale(.62, .07) translateY(30px);
      }
    }

    /* 聚成的墨团：先在底部铺开，再摊平淡去 */
    .avatar .puddle {
      opacity: 0;
      filter: blur(.35px);
      transform-box: view-box;
      transform-origin: 74px 146px;
      animation: puddleForm 18s cubic-bezier(.2, .8, .4, 1) infinite;
    }

    .avatar .ink-puddle {
      fill: rgba(22, 25, 32, .94);
    }

    .avatar .ink-puddle-2 {
      fill: rgba(22, 25, 32, .3);
    }

    @keyframes puddleForm {
      0%, 81% {
        opacity: 0;
        transform: scale(.12, .4) translateY(0);
      }

      86% {
        opacity: .92;
        transform: scale(1, 1) translateY(0);
      }

      90% {
        opacity: .9;
        transform: scale(1.1, .94) translateY(1px);
      }

      95% {
        opacity: .6;
        transform: scale(.96, .74) translateY(5px);
      }

      100% {
        opacity: 0;
        transform: scale(.78, .46) translateY(10px);
      }
    }

    /* 墨滴物理层：只负责绘制，不吃鼠标事件 */
    .ink-field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 2;
    }

    /* ===== 水墨猫狗：由墨团幻化，待机呼吸后一次连续的"两跳"行程 ===== */
    /* 「你好，我是胡方峥」的父容器 —— 猫狗以它为定位基准 */
    .intro {
      position: relative;
    }

    .pets {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .pet {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      filter: blur(5px);
      transition: opacity .55s ease, filter .55s ease;
      will-change: left, top, opacity;
    }

    .pets.is-in .pet {
      opacity: 1;
      filter: blur(0);
    }

    .pets.is-in .pet-dog {
      transition-delay: .12s;
    }

    .pet img {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 50% 100%;
      /* 水平翻转：面向左边。翻转放在图片上，位移在父层，互不覆盖 */
      transform: scaleX(-1);
      animation: petBreathe 2s ease-in-out infinite;
    }

    /* 待机：2 秒一轮的呼吸起伏（关键帧里始终带着 scaleX(-1)，翻转不会中途丢失） */
    @keyframes petBreathe {
      0%, 100% {
        transform: scaleX(-1) translateY(0) scale(1);
      }

      50% {
        transform: scaleX(-1) translateY(-1.6px) scale(1.028);
      }
    }

    /* 狗的原图本身已经朝左，再翻转会变成朝右，所以单独覆盖回来 */
    .pet-dog img {
      transform: scaleX(1);
      animation-name: petBreatheDog;
    }

    @keyframes petBreatheDog {
      0%, 100% {
        transform: scaleX(1) translateY(0) scale(1);
      }

      50% {
        transform: scaleX(1) translateY(-1.6px) scale(1.028);
      }
    }

    .pet-cat {
      width: 104px;
    }

    .pet-dog {
      width: 132px;
    }

    /* 猫狗的位移完全由 JS 逐帧写入 left / top（像素值），这里不做任何关键帧动画 */
    .pets.is-in .pet {
      transition: opacity .55s ease, filter .55s ease;
    }

    /* ===== 爪印盖章：砸地 ===== */
    .stamps {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    .stamp {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .stamp img {
      display: block;
      width: 100%;
      height: auto;
      /* 正片叠底：墨色压进文字与纸面，白底不挡字 */
      mix-blend-mode: multiply;
    }

    .stamp-cat {
      width: 104px;
    }

    .stamp-dog {
      width: 100px;
    }

    /* 从天而降：scale(3) 全透明 → 猛地砸成 scale(1)，带过冲回弹 */
    .stamps.is-hit .stamp-cat {
      animation: pawSlam .62s cubic-bezier(.175, .885, .32, 1.275) both;
    }

    .stamps.is-hit .stamp-dog {
      animation: pawSlam .62s cubic-bezier(.175, .885, .32, 1.275) .1s both;
    }

    @keyframes pawSlam {
      0% {
        opacity: 0;
        transform: translateY(-72px) scale(3);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 砸地瞬间整张卡片颤一下 */
    .profile.is-hit {
      animation: stampShake .44s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes stampShake {
      0%, 100% {
        transform: translate(0, 0);
      }

      12% {
        transform: translate(-3px, 2px);
      }

      26% {
        transform: translate(3px, -2px);
      }

      42% {
        transform: translate(-2px, -1px);
      }

      58% {
        transform: translate(2px, 1px);
      }

      76% {
        transform: translate(-1px, 0);
      }
    }

    /* 猫狗瞬间缩小消失 */
    .pets.is-gone .pet {
      opacity: 0;
      transform: scale(.42);
      transition: opacity .22s ease, transform .22s ease;
    }

    /* ===== 爱好列表 ===== */
    .hobbies {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .hobby {
      flex: 1 1 240px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: rgba(252, 254, 255, .82);
      border: 1px solid rgba(30, 130, 200, .18);
      border-radius: 14px;
      transition: transform .4s cubic-bezier(.2, .7, .2, 1), box-shadow .4s, border-color .4s;
    }

    .hobby:hover {
      transform: translateY(-5px);
      border-color: rgba(30, 130, 210, .45);
      box-shadow: 0 18px 38px rgba(10, 70, 130, .16);
    }

    .hobby a {
      margin-top: auto;
      font-weight: bold;
      text-decoration: none;
    }

    /* ===== 3D 画廊（Swiper Cover Flow） ===== */
    .gallery-swiper {
      --swiper-theme-color: #0b4a76;
      --swiper-navigation-size: 15px;

      width: 100%;
      padding: 10px 0 46px;
      overflow: hidden;
    }

    .gallery-swiper .swiper-slide {
      width: 300px;
      height: 380px;
      border-radius: 12px;
      overflow: hidden;
      opacity: .5;
      box-shadow: 0 10px 26px rgba(8, 40, 80, .16);
      transition: opacity .45s ease, box-shadow .45s ease;
    }

    .gallery-swiper .swiper-slide-active {
      opacity: 1;
      box-shadow: 0 22px 48px rgba(8, 50, 100, .3);
    }

    .gallery-swiper .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      cursor: zoom-in;
    }

  <script>
    (function () {
      var canvas = document.getElementById('bg-waves');
      if (!canvas || !canvas.getContext) return;

      var ctx = canvas.getContext('2d', { alpha: false });
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W = 0, H = 0, dpr = 1;
      var baseFill = null, layerGrads = [];
      var ripples = [];
      var elapsed = 0, last = 0, raf = 0, nextRipple = 0.2;

      /* 时间倍率：0.14 ≈ 放慢 7 倍，单波周期 40s 以上，退成"静谧暗流" */
      var TIME_SCALE = 0.14;

      /* 七层波：层数越靠下振幅越大、频率越低，形成水的层次与干涉 */
      var layers = [];
      for (var i = 0; i < 7; i++) {
        layers.push({
          y: 0.24 + i * 0.085,
          amp: 18 + i * 10,
          freq: 0.0017 + i * 0.00036,
          freq2: 0.0041 - i * 0.00018,
          drift: (i % 2 === 0 ? 1 : -1) * (1.05 + i * 0.20),
          alpha: 0.62 - i * 0.035,
          width: 1.8 - i * 0.09,
          phase: i * 1.15
        });
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        /* 通透的浅蓝底：接近白的水色，留出呼吸感 */
        baseFill = ctx.createLinearGradient(0, 0, W * 0.4, H);
        baseFill.addColorStop(0, '#f6fdff');
        baseFill.addColorStop(0.35, '#ddf1ff');
        baseFill.addColorStop(0.68, '#c3e4fd');
        baseFill.addColorStop(1, '#eefaff');

        /* 每层波各用一档蓝色，层层叠出鲜活的层次 */
        var palette = ['6,96,182', '0,118,196', '8,78,152', '10,136,202', '0,100,170', '14,112,192', '0,146,192'];
        layerGrads = layers.map(function (L, i) {
          var c = palette[i % palette.length];
          var g = ctx.createLinearGradient(0, 0, W, 0);
          g.addColorStop(0, 'rgba(' + c + ',0)');
          g.addColorStop(0.16, 'rgba(' + c + ',.46)');
          g.addColorStop(0.5, 'rgba(' + c + ',.86)');
          g.addColorStop(0.84, 'rgba(' + c + ',.46)');
          g.addColorStop(1, 'rgba(' + c + ',0)');
          return g;
        });
      }

      function drawRipples() {
        for (var i = ripples.length - 1; i >= 0; i--) {
          var rp = ripples[i];
          var p = (elapsed - rp.born) / rp.dur;
          if (p >= 1) { ripples.splice(i, 1); continue; }

          var ease = 1 - Math.pow(1 - p, 2.2);
          var rad = 6 + ease * rp.maxR;
          var a = Math.pow(1 - p, 1.8) * 0.62;

          ctx.save();
          ctx.translate(rp.x, rp.y);
          ctx.scale(1, 0.62); /* 压扁成椭圆，模拟水面透视 */

          ctx.beginPath();
          ctx.arc(0, 0, rad, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(14,102,180,' + a.toFixed(3) + ')';
          ctx.lineWidth = 1.4;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, rad * 0.72, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(10,140,205,' + (a * 0.6).toFixed(3) + ')';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          ctx.restore();
        }
      }

      function drawWaves() {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (var i = 0; i < layers.length; i++) {
          var L = layers[i];
          var y0 = H * L.y;
          ctx.strokeStyle = layerGrads[i] || 'rgba(56,182,255,.45)';

          ctx.beginPath();
          for (var x = 0; x <= W + 6; x += 6) {
            var y = y0
              + Math.sin(x * L.freq + elapsed * L.drift + L.phase) * L.amp
              + Math.sin(x * L.freq2 - elapsed * L.drift * 1.6 + 1.7 + L.phase) * L.amp * 0.42
              + Math.sin(x * 0.0009 + elapsed * 0.45) * 18;
            if (x === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }

          /* 同一路径描两遍：粗的做柔光，细的做芯线 */
          ctx.globalAlpha = L.alpha * 0.30;
          ctx.lineWidth = L.width * 8;
          ctx.stroke();

          ctx.globalAlpha = L.alpha;
          ctx.lineWidth = L.width;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      /* 三团缓慢游动的彩色水汽：multiply 叠在水色上，像水彩晕开 */
      var spots = [
        { x: 0.20, y: 0.22, r: 0.62, c: '24,130,214', a: 0.24, ax: 0.14, ay: 0.10, ph: 0 },
        { x: 0.80, y: 0.36, r: 0.55, c: '58,108,226', a: 0.20, ax: 0.10, ay: 0.13, ph: 2.1 },
        { x: 0.48, y: 0.80, r: 0.62, c: '0,166,206', a: 0.22, ax: 0.12, ay: 0.08, ph: 4.2 }
      ];

      function drawSpots() {
        var count = W < 720 ? 2 : spots.length;
        ctx.globalCompositeOperation = 'multiply';

        for (var i = 0; i < count; i++) {
          var sp = spots[i];
          var cx = W * (sp.x + sp.ax * Math.sin(elapsed * 0.20 + sp.ph));
          var cy = H * (sp.y + sp.ay * Math.cos(elapsed * 0.16 + sp.ph));
          var rad = Math.max(W, H) * sp.r;

          var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
          g.addColorStop(0, 'rgba(' + sp.c + ',' + sp.a + ')');
          g.addColorStop(0.55, 'rgba(' + sp.c + ',' + (sp.a * 0.45).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(' + sp.c + ',0)');
          ctx.fillStyle = g;

          /* 只填渐变覆盖到的区域，省性能 */
          var x0 = Math.max(0, cx - rad), y0 = Math.max(0, cy - rad);
          var x1 = Math.min(W, cx + rad), y1 = Math.min(H, cy + rad);
          ctx.fillRect(x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0));
        }

        ctx.globalCompositeOperation = 'source-over';
      }

      function render() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = baseFill;
        ctx.fillRect(0, 0, W, H);

        drawSpots();
        drawRipples();
        drawWaves();
      }

      function frame(now) {
        if (!last) last = now;
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        elapsed += dt * TIME_SCALE;

        if (elapsed > nextRipple) {
          nextRipple = elapsed + 0.45 + Math.random() * 0.85;
          ripples.push({
            x: W * (0.08 + Math.random() * 0.84),
            y: H * (0.10 + Math.random() * 0.88),
            born: elapsed,
            dur: 3.4 + Math.random() * 2.6,
            maxR: 140 + Math.random() * 320
          });
          if (ripples.length > 9) ripples.shift();
        }

        render();
        raf = requestAnimationFrame(frame);
      }

      function start() {
        if (raf) return;
        last = 0;
        raf = requestAnimationFrame(frame);
      }

      function stop() {
        if (!raf) return;
        cancelAnimationFrame(raf);
        raf = 0;
      }

      var resizeTimer = 0;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          resize();
          if (reduceMotion || !raf) render();
        }, 150);
      });

      /* 切到后台时停掉动画，省电 */
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          stop();
        } else if (!reduceMotion) {
          start();
        }
      });

      resize();

      if (reduceMotion) {
        /* 系统要求减少动效：只画一帧静态水波 */
        elapsed = 6;
        render();
      } else {
        start();
      }
    })();
  </script>

  <script>
    /* 墨滴重力 → 落地成滩 → 墨滩化出猫狗 → 待机呼吸 → 猫先狗后向左上跳出 */
    (function () {
      var stage = document.querySelector('.profile');
      var field = document.querySelector('.ink-field');
      var groundEl = document.querySelector('.who-cares');
      var pets = document.querySelector('.pets');
      var catEl = document.querySelector('.pet-cat');
      var dogEl = document.querySelector('.pet-dog');
      var stamps = document.querySelector('.stamps');
      var catPaw = document.querySelector('.stamp-cat');
      var dogPaw = document.querySelector('.stamp-dog');
      if (!stage || !field || !groundEl || !pets || !catEl || !dogEl) return;

      var NS = 'http://www.w3.org/2000/svg';
      var GRAVITY = 1500;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var small = window.matchMedia('(max-width: 720px)');

      var parts = [];
      var pool = null;
      var poolRx = 2;
      var travelAnim = null;
      var startedAt = performance.now();
      var lastFrame = 0;
      var spawnAt = 0;
      var petT0 = null;      /* 人物 18s 走完的时刻 */

      function readPhase() {
        if (!travelAnim && document.getAnimations) {
          var list = document.getAnimations();
          for (var i = 0; i < list.length; i++) {
            if (list[i].animationName === 'travel') { travelAnim = list[i]; break; }
          }
        }
        return (travelAnim && typeof travelAnim.currentTime === 'number')
          ? travelAnim.currentTime
          : performance.now() - startedAt;
      }

      var mCache = null;
      var mAt = -1e9;

      function metrics() {
        var t = performance.now();
        if (mCache && t - mAt < 240) return mCache;
        mAt = t;
        var box = stage.getBoundingClientRect();
        var avEl = stage.querySelector('.avatar');
        var av = avEl ? avEl.getBoundingClientRect() : box;
        var gr = groundEl.getBoundingClientRect();
        mCache = {
          originX: av.left - box.left + av.width / 2,
          originY: av.top - box.top + av.height * 0.85,
          ground: gr.bottom - box.top - 1,
          left: 10,
          right: box.width - 10
        };
        return mCache;
      }

      function spawn(m, count) {
        for (var i = 0; i < count; i++) {
          if (parts.length > 110) return;
          var r = 1.8 + Math.random() * 2.4;
          var el = document.createElementNS(NS, 'ellipse');
          el.setAttribute('fill', 'rgba(20, 23, 30, ' + (0.72 + Math.random() * 0.24).toFixed(2) + ')');
          field.appendChild(el);
          parts.push({
            el: el,
            x: m.originX + (Math.random() - 0.5) * 34,
            y: m.originY + (Math.random() - 0.5) * 6,
            vx: (Math.random() - 0.5) * 26,
            vy: 8 + Math.random() * 30,
            rx: r,
            ry: r * 1.15,
            landed: false,
            dir: Math.random() < 0.5 ? -1 : 1
          });
        }
      }

      function ensurePool(m) {
        if (pool) return;
        poolRx = 2;
        pool = document.createElementNS(NS, 'ellipse');
        pool.setAttribute('fill', 'rgba(20, 23, 30, 0.5)');
        pool.setAttribute('cx', m.originX);
        pool.setAttribute('cy', m.ground - 2.6);
        pool.setAttribute('rx', 2);
        pool.setAttribute('ry', 2.6);
        pool.setAttribute('opacity', '0');
        if (field.insertBefore && field.firstChild) field.insertBefore(pool, field.firstChild);
        else field.appendChild(pool);
      }

      function clear() {
        for (var i = 0; i < parts.length; i++) {
          if (parts[i].el.parentNode) parts[i].el.parentNode.removeChild(parts[i].el);
        }
        parts.length = 0;
        if (pool && pool.parentNode) pool.parentNode.removeChild(pool);
        pool = null;
        poolRx = 2;
      }

      /* ---------- 猫狗：实测锚点坐标 + 逐帧写死 left/top ---------- */
      var T_JUMP = 1760;     /* 第一段 1.76s */
      var T_HOLD = 880;      /* 半空停顿 0.88s */
      var T_JUMP2 = 1760;    /* 第二段 1.76s */
      var DOG_DELAY = 500;   /* 狗晚 0.5s */

      var journeyT = 0;
      var petDone = false;
      var stamped = false;
      var geo = null;

      function measure() {
        var box = stage.getBoundingClientRect();
        var pb = pets.getBoundingClientRect();                 /* 猫狗容器（.pets） */
        var avEl = stage.querySelector('.avatar');
        var av = avEl ? avEl.getBoundingClientRect() : box;
        var gr = groundEl.getBoundingClientRect();

        /* 锚点取不到也不能抛异常，否则整段位移会停住 */
        var l1El = document.querySelector('.big-data') || groundEl;
        var h2El = document.getElementById('target-title') || stage.querySelector('h2') || l1El;
        var l1 = l1El.getBoundingClientRect();
        var h2 = h2El.getBoundingClientRect();

        var cw = catEl.offsetWidth || 104;
        var ch = catEl.offsetHeight || 106;
        var dw = dogEl.offsetWidth || 132;
        var dh = dogEl.offsetHeight || 136;
        var gap = 8;
        var total = cw + gap + dw;
        var maxH = Math.max(ch, dh);

        var ox = pb.left;
        var oy = pb.top;
        var limitL = 8 - (pb.left - box.left);
        var limitR = box.width - total - 8 - (pb.left - box.left);

        function clampX(v) {
          return Math.min(Math.max(limitL, v), Math.max(limitL, limitR));
        }

        /* 起点：墨团正下方、地面之上 */
        var sx = clampX(av.left + av.width / 2 - ox - total / 2);
        var gY = gr.bottom - oy - 2;

        /* 第一落点：「大数据」行正上方（该行中心 - 整体半宽） */
        var x1 = clampX(l1.left + l1.width / 2 - ox - total / 2);
        var b1 = (l1.top - oy) - 16;

        /* 强制左对齐：猫狗左边缘对齐「你好」文字左边缘，再右移 20px 防贴边 */
        var x2 = clampX(h2.left - ox + 20);
        var b2 = (h2.top - oy) - 80;
        /* 兜底：抬得再高也不能让猫狗顶出卡片上沿 */
        b2 = Math.max(b2, 10 + maxH - oy);

        var top0 = gY - maxH;
        var top1 = b1 - maxH;
        var top2 = b2 - maxH;

        geo = {
          cw: cw,
          ch: ch,
          dh: dh,
          gap: gap,
          sx: sx,
          gY: gY,
          x1: x1,
          b1: b1,
          x2: x2,
          b2: b2,
          h2x: h2.left - ox,
          h2y: h2.top - oy,
          h2h: h2.height,
          jh1: Math.min(60, Math.max(18, (top0 + top1) / 2 + oy - 10)),
          jh2: Math.min(50, Math.max(14, (top1 + top2) / 2 + oy - 10))
        };
        return geo;
      }

      /* 单只动物的行程：抛物线 + 停顿，直接写 left/top 像素值 */
      function pose(el, x0, y0, x1, y1, x2, y2, t, delay, h1, h2) {
        var tau = t - delay;
        var x, y;

        if (tau <= 0) {
          x = x0;
          y = y0;
        } else if (tau < T_JUMP) {
          var p = tau / T_JUMP;
          x = x0 + (x1 - x0) * p;
          y = y0 + (y1 - y0) * p - h1 * 4 * p * (1 - p);
        } else if (tau < T_JUMP + T_HOLD) {
          x = x1;
          y = y1;
        } else if (tau < T_JUMP + T_HOLD + T_JUMP2) {
          var q = (tau - T_JUMP - T_HOLD) / T_JUMP2;
          x = x1 + (x2 - x1) * q;
          y = y1 + (y2 - y1) * q - h2 * 4 * q * (1 - q);
        } else {
          x = x2;
          y = y2;
        }

        el.style.left = x.toFixed(1) + 'px';
        el.style.top = y.toFixed(1) + 'px';
      }

      function poseAll(t) {
        var g = geo || measure();
        pose(catEl, g.sx, g.gY - g.ch, g.x1, g.b1 - g.ch, g.x2, g.b2 - g.ch, t, 0, g.jh1, g.jh2);
        pose(dogEl, g.sx + g.cw + g.gap, g.gY - g.dh, g.x1 + g.cw + g.gap, g.b1 - g.dh,
             g.x2 + g.cw + g.gap, g.b2 - g.dh, t, DOG_DELAY, g.jh1, g.jh2);
      }

      /* 爪印落在标题行上：左对齐标题文字，约在行中线 */
      function placePaws() {
        if (!stamps || !catPaw || !dogPaw) return;
        var g = geo || measure();
        var cw2 = catPaw.offsetWidth || 104;
        var ch2 = catPaw.offsetHeight || 107;
        var dw2 = dogPaw.offsetWidth || 100;
        var dh2 = dogPaw.offsetHeight || 92;

        var baseX = g.h2x + 10;
        /* 爪印底边锚在标题上沿往上 10px，绝不压住文字 */
        var pawBottom = g.h2y - 10;

        catPaw.style.left = baseX.toFixed(1) + 'px';
        catPaw.style.top = (pawBottom - ch2).toFixed(1) + 'px';
        dogPaw.style.left = (baseX + cw2 + 8).toFixed(1) + 'px';
        dogPaw.style.top = (pawBottom - dh2).toFixed(1) + 'px';
      }

      /* 猫狗缩小消失 → 爪印砸下 → 卡片震动 */
      function stampNow() {
        placePaws();
        pets.classList.add('is-gone');
        if (stamps) stamps.classList.add('is-hit');
        stage.classList.add('is-hit');
      }

      if (window.addEventListener) {
        window.addEventListener('resize', function () {
          mCache = null;
          geo = null;
          petDone = false;
          if (petT0 !== null) {
            measure();
            poseAll(journeyT);
            if (stamped) placePaws();
          }
        });
      }

      /* ---------- 主循环 ---------- */
      function tick(now) {
        requestAnimationFrame(tick);

        if (reduce.matches) {
          clear();
          pets.classList.remove('is-in');
          return;
        }

        var phase = readPhase();
        var finished = travelAnim && travelAnim.playState === 'finished';

        /* 人物走完 → 墨滩化形，猫狗淡入站上隐形地面 */
        if (petT0 === null && (finished || phase >= 17980)) {
          petT0 = now;
          measure();
          poseAll(0);
          pets.classList.add('is-in');

          /* 兜底：万一 rAF 被浏览器节流，定时器仍会把最终坐标写死 */
          setTimeout(function () {
            measure();
            poseAll(1e6);
            petDone = true;
          }, 6400);
        }

        /* 待机 1.4 秒后开始两段行程，每帧把算好的像素写进 left/top */
        if (petT0 !== null && !petDone) {
          journeyT = Math.max(0, now - petT0 - 1400);
          poseAll(journeyT);
          if (journeyT > T_JUMP + T_HOLD + T_JUMP2 + DOG_DELAY + 200) petDone = true;

          /* 两只都落地后 → 盖章变身 */
          if (!stamped && journeyT > 5000) {
            stamped = true;
            stampNow();
          }
        }

        var spawning = petT0 === null && phase > 14800 && phase < 16800;
        if (!spawning && !parts.length) { lastFrame = now; return; }

        var m = metrics();
        if (spawning && now - spawnAt > 58) {
          spawnAt = now;
          spawn(m, small.matches ? 1 : 2);
        }
        if (!parts.length) { lastFrame = now; return; }

        var dt = lastFrame ? Math.min(0.034, (now - lastFrame) / 1000) : 0.016;
        lastFrame = now;

        var fade = 1;
        if (petT0 !== null) {
          var k = (now - petT0) / 420;
          fade = k >= 1 ? 0 : 1 - k;
        }

        if (parts.length) ensurePool(m);
        if (pool) {
          var limit = Math.min(150, m.right - m.originX - 4, m.originX - m.left - 4);
          poolRx += (Math.max(20, limit) - poolRx) * Math.min(1, dt * 1.6);
          var poolRy = 2.6 + poolRx * 0.012;
          pool.setAttribute('rx', poolRx.toFixed(1));
          pool.setAttribute('ry', poolRy.toFixed(2));
          pool.setAttribute('cy', (m.ground - poolRy).toFixed(2));
          pool.setAttribute('opacity', (0.5 * fade).toFixed(2));
        }

        for (var i = parts.length - 1; i >= 0; i--) {
          var p = parts[i];

          if (!p.landed) {
            p.vy += GRAVITY * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            if (p.y + p.ry >= m.ground) {
              p.y = m.ground - p.ry;
              p.landed = true;
              p.vx = p.dir * (70 + Math.random() * 90);
              p.vy = 0;
              p.ry = Math.max(2, p.ry * 0.6);
              p.rx *= 1.35;
            }
          } else {
            p.vx *= Math.pow(0.4, dt);
            p.x += p.vx * dt;
            p.rx += Math.abs(p.vx) * dt * 0.14;

            if (p.x - p.rx < m.left) { p.x = m.left + p.rx; p.vx = Math.abs(p.vx) * 0.35; }
            if (p.x + p.rx > m.right) { p.x = m.right - p.rx; p.vx = -Math.abs(p.vx) * 0.35; }
          }

          p.el.setAttribute('cx', p.x.toFixed(1));
          p.el.setAttribute('cy', p.y.toFixed(1));
          p.el.setAttribute('rx', p.rx.toFixed(2));
          p.el.setAttribute('ry', p.ry.toFixed(2));
          p.el.setAttribute('opacity', fade.toFixed(2));
        }

        if (fade <= 0) clear();
      }

      requestAnimationFrame(tick);
    })();
  </script>

  <script>
    (function () {
      var boxes = document.querySelectorAll('.gallery-swiper');
      if (!boxes.length) return;

      /* CDN 拿不到时退化成可横向滑动的普通画廊，不至于白屏 */
      if (typeof window.Swiper !== 'function') {
        for (var i = 0; i < boxes.length; i++) boxes[i].classList.add('no-swiper');
        return;
      }

      for (var j = 0; j < boxes.length; j++) {
        new Swiper(boxes[j], {
          effect: 'coverflow',
          grabCursor: true,
          centeredSlides: true,
          slidesPerView: 'auto',
          loop: true,
          /* 循环缓冲：多复制 5 张参与拼接，保证右侧永远有"下一张"可滑入 */
          loopedSlides: 5,
          loopAdditionalSlides: 3,
          speed: 700,
          spaceBetween: 18,
          autoplay: {
            delay: 2600,
            disableOnInteraction: false,
            pauseOnMouseEnter: true,
            stopOnLastSlide: false,
            waitForTransition: true
          },
          coverflowEffect: {
            rotate: 16,
            stretch: 0,
            depth: 140,
            modifier: 1.1,
            slideShadows: false
          },
          pagination: boxes[j].getAttribute('data-no-dots') === 'true' ? false : {
            el: boxes[j].querySelector('.swiper-pagination'),
            clickable: true
          },
          navigation: {
            nextEl: boxes[j].querySelector('.swiper-button-next'),

  <!-- 图片灯箱：原生 JS，不依赖任何插件 -->
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      if (!box) return;
      var bigImg = box.querySelector('img');

      var downX = 0;
      var downY = 0;
      var dragged = false;

      /* 记录按下位置，用来区分"点击"和"拖动 Swiper" */
      document.addEventListener('pointerdown', function (e) {
        downX = e.clientX;
        downY = e.clientY;
        dragged = false;
      }, true);

      document.addEventListener('pointermove', function (e) {
        if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) dragged = true;
      }, true);

      /* 事件委托：三个画廊里的图片统一处理 */
      document.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'IMG') return;

        var host = t.closest('.gallery-swiper');
        if (!host) return;

        /* 拖动过，或 Swiper 判定这次不是有效点击 → 不弹窗 */
        if (dragged) return;
        if (host.swiper && host.swiper.allowClick === false) return;

        open(t.getAttribute('src'), t.getAttribute('alt'));
      }, true);

      function open(src, alt) {
        if (!src) return;
        bigImg.setAttribute('src', src);
        bigImg.setAttribute('alt', alt || '');
        box.classList.add('is-open');
        box.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function close() {
        box.classList.remove('is-open');
        box.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        /* 等淡出结束再清掉 src，避免下次打开时闪一下旧图 */
        setTimeout(function () {
          if (!box.classList.contains('is-open')) bigImg.removeAttribute('src');
        }, 320);
      }

      /* 点遮罩或点图片本身都关闭 */
      box.addEventListener('click', close);

      document.addEventListener('keydown', function (e) {
        if ((e.key === 'Escape' || e.key === 'Esc') && box.classList.contains('is-open')) close();
      });
    })();
  </script>

  <!-- 水晶球星光：Canvas 粒子（6 种形状 × 3 种颜色，150~200 颗） -->
  <script>
    (function () {
      var canvas = document.getElementById('bg-stars');
      if (!canvas || !canvas.getContext) return;

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var SPRITE = 64;
      var SIZE_SCALE = 5;          /* 星星整体放大 5 倍（想回调就改这里） */
      var W = 0;
      var H = 0;
      var sprites = [];
      var parts = [];
      var running = true;
      var t = 0;
      var last = 0;
      var shadowScale = 1;         /* 阴影发光强度系数（性能不足时自动降低） */
      var statFrames = 0;
      var statTime = 0;

      /* 形状：四角星芒 / 六角星 / 拉长十字光 / 菱形光斑 / 六边形碎片 / 微光点 */
      var SHAPES = ['star4', 'star6', 'flare', 'diamond', 'hex', 'dot'];
      var SHAPE_WEIGHT = [16, 22, 18, 20, 14, 10];
      var SHAPE_SIZE = {
        star4: [6, 12],
        star6: [5, 11],
        flare: [7, 12],
        diamond: [4, 9],
        hex: [2.5, 6],
        dot: [2, 4]
      };

      /* 颜色：深琥珀金 / 暗金 / 星光蓝 */
      var COLORS = [[212, 175, 55], [184, 134, 11], [30, 144, 255]];
      var COLOR_WEIGHT = [55, 30, 15];

      function rand(a, b) { return a + Math.random() * (b - a); }

      function pick(weights) {
        var total = 0;
        var i;
        for (i = 0; i < weights.length; i++) total += weights[i];
        var r = Math.random() * total;
        for (i = 0; i < weights.length; i++) {
          r -= weights[i];
          if (r <= 0) return i;
        }
        return weights.length - 1;
      }

      function makeSprite(kind, rgb) {
        var c = document.createElement('canvas');
        c.width = c.height = SPRITE;
        var g = c.getContext('2d');
        var cx = SPRITE / 2;
        var cy = SPRITE / 2;
        var R = SPRITE * 0.44;
        var col = rgb.join(', ');
        var i, ang, x, y, rr;

        /* 底层柔光 */
        var rg = g.createRadialGradient(cx, cy, 0, cx, cy, cx);
        rg.addColorStop(0, 'rgba(' + col + ',0.55)');
        rg.addColorStop(0.4, 'rgba(' + col + ',0.16)');
        rg.addColorStop(1, 'rgba(' + col + ',0)');
        g.fillStyle = rg;
        g.beginPath();
        g.arc(cx, cy, cx, 0, Math.PI * 2);
        g.fill();

        g.fillStyle = 'rgba(' + col + ',1)';

        if (kind === 'star4' || kind === 'star6') {
          var spikes = kind === 'star4' ? 4 : 6;
          var inner = kind === 'star4' ? 0.16 : 0.44;
          g.beginPath();
          for (i = 0; i < spikes * 2; i++) {
            rr = (i % 2 === 0) ? R : R * inner;
            ang = -Math.PI / 2 + i * Math.PI / spikes;
            x = cx + Math.cos(ang) * rr;
            y = cy + Math.sin(ang) * rr;
            if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
          }
          g.closePath();
          g.fill();

        } else if (kind === 'flare') {
          /* ✨ 拉长十字：两条主光 + 两条 45° 短芒 */
          g.save();
          g.translate(cx, cy);
          /* 横向光用水平渐变，纵向光用垂直渐变，避免光心偏移 */
          var lgH = g.createLinearGradient(-R, 0, R, 0);
          lgH.addColorStop(0, 'rgba(' + col + ',0)');
          lgH.addColorStop(0.5, 'rgba(' + col + ',1)');
          lgH.addColorStop(1, 'rgba(' + col + ',0)');
          g.fillStyle = lgH;
          g.beginPath();
          g.ellipse(0, 0, R, R * 0.085, 0, 0, Math.PI * 2);
          g.fill();

          var lgV = g.createLinearGradient(0, -R, 0, R);
          lgV.addColorStop(0, 'rgba(' + col + ',0)');
          lgV.addColorStop(0.5, 'rgba(' + col + ',1)');
          lgV.addColorStop(1, 'rgba(' + col + ',0)');
          g.fillStyle = lgV;
          g.beginPath();
          g.ellipse(0, 0, R * 0.085, R, 0, 0, Math.PI * 2);
          g.fill();

          g.globalAlpha = 0.7;
          g.beginPath();
          g.ellipse(0, 0, R * 0.6, R * 0.05, Math.PI / 4, 0, Math.PI * 2);
          g.fill();
          g.beginPath();
          g.ellipse(0, 0, R * 0.6, R * 0.05, -Math.PI / 4, 0, Math.PI * 2);
          g.fill();
          g.restore();

        } else if (kind === 'diamond') {
          g.beginPath();
          g.moveTo(cx, cy - R);
          g.quadraticCurveTo(cx + R * 0.28, cy, cx, cy + R);
          g.quadraticCurveTo(cx - R * 0.28, cy, cx, cy - R);
          g.closePath();
          g.fill();

        } else if (kind === 'hex') {
          g.beginPath();
          for (i = 0; i < 6; i++) {
            ang = -Math.PI / 2 + i * Math.PI / 3;
            x = cx + Math.cos(ang) * R * 0.62;
            y = cy + Math.sin(ang) * R * 0.62;
            if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
          }
          g.closePath();
          g.fill();
        }

        return c;
      }

      function buildSprites() {
        sprites = [];
        for (var s = 0; s < SHAPES.length; s++) {
          var row = [];
          for (var c = 0; c < COLORS.length; c++) row.push(makeSprite(SHAPES[s], COLORS[c]));
          sprites.push(row);
        }
      }

      function makeParticle(anywhere) {
        var si = pick(SHAPE_WEIGHT);
        var ci = pick(COLOR_WEIGHT);
        var depth = Math.pow(Math.random(), 1.5);      /* 大部分偏小 = 远 */
        var range = SHAPE_SIZE[SHAPES[si]];
        var vy = 6 + Math.pow(depth, 1.35) * 84;       /* 6 ~ 90 px/s */
        if (ci === 2) vy *= 1.25;                      /* 星光蓝跑得稍快 */

        return {
          s: si,
          c: ci,
          size: (range[0] + (range[1] - range[0]) * depth) * SIZE_SCALE,
          x: Math.random() * W,
          y: anywhere ? rand(-H * 0.25, H) : rand(-90, -12),
          vy: vy,
          amp: rand(6, 48),
          freq: rand(0.2, 0.8),
          phase: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI * 2,
          vrot: rand(-0.45, 0.45),
          tw: rand(0.6, 2.0),
          twPhase: Math.random() * Math.PI * 2,
          alpha: rand(0.7, 1)
        };
      }

      function mobile() {
        return window.innerWidth < 720 ||
          /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        var n = Math.round((W * H) / 7000);
        if (mobile()) n = Math.min(80, Math.max(50, n));
        else n = Math.min(200, Math.max(150, n));

        parts.length = 0;
        for (var i = 0; i < n; i++) parts.push(makeParticle(true));
      }

      function frame(now) {
        if (!running) return;
        requestAnimationFrame(frame);

        var raw = last ? now - last : 16;
        var dt = Math.min(0.05, raw / 1000);
        last = now;
        t += dt;

        /* 阴影模糊较吃性能：连续测得平均帧 > 26ms 就关掉，仅保留精灵自带柔光 */
        statTime += raw;
        if (++statFrames >= 90) {
          var avg = statTime / statFrames;
          if (avg > 26) shadowScale = 0.32;        /* 掉到 ~38fps 以下：光晕收窄，不至于卡 */
          else if (avg < 18) shadowScale = 1;      /* 流畅时恢复全强度 */
          statFrames = 0;
          statTime = 0;
        }

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];

          p.y += p.vy * dt;
          p.rot += p.vrot * dt;

          if (p.y - p.size > H + 60) {
            parts[i] = makeParticle(false);
            continue;
          }

          var a = p.alpha * (0.88 + 0.12 * Math.sin(t * p.tw + p.twPhase));
          if (a <= 0.02) continue;

          var px = p.x + Math.sin(t * p.freq + p.phase) * p.amp;
          var s = p.size / SPRITE * dpr;
          /* 快的粒子纵向拉长，形成流星拖尾 */
          var stretch = p.vy > 58 ? 1 + (p.vy - 58) / 58 * 1.5 : 1;
          var kx = s / Math.sqrt(stretch);
          var ky = s * stretch;

          var co = Math.cos(p.rot);
          var si = Math.sin(p.rot);

          ctx.setTransform(co * kx, si * kx, -si * ky, co * ky, px * dpr, p.y * dpr);
          ctx.globalAlpha = a > 1 ? 1 : a;

          /* 边缘发光：颜色取自该星星本身，模糊半径随尺寸走 */
          ctx.shadowColor = 'rgba(' + COLORS[p.c].join(',') + ',0.85)';
          ctx.shadowBlur = Math.min(42, (4 + p.size * dpr * 0.55) * shadowScale);

          ctx.drawImage(sprites[p.s][p.c], -SPRITE / 2, -SPRITE / 2);
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      buildSprites();
      resize();
      requestAnimationFrame(frame);

      var rt;
      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(resize, 180);
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          running = false;
        } else if (!running) {
          running = true;
          last = 0;
          requestAnimationFrame(frame);
        }
      });
    })();
  </script>

</body>

</html>
